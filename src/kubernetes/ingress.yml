apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rocket-ingress
  namespace: user-morgannder
spec:
  ingressClassName: nginx
  rules:
  - host: rocketcl.api.kub.sspcloud.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rocket-app-service
            port:
              number: 8000
  - host: rocketclstats.api.kub.sspcloud.fr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rocket-frontend-service
            port:
              number: 80
