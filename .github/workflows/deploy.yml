name: CI/CD Pipeline

on:
  push:
    branches: [ "develop" ] # Se déclenche quand tu pushes sur la branche develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # On construit pour Linux/AMD64 pour être compatible avec le SSP Cloud
          platforms: linux/amd64
          tags: meaumeau/ensai2a-cl-rlstatsanalysis:latest

      - name: Set up Kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Trigger Kubernetes Update
        run: |
          kubectl rollout restart deployment rocket-app
